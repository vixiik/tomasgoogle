<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Image Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page image-page">
  <header class="top-nav"><a href="index.html">Google Search</a><a href="advanced.html">Advanced Search</a><a href="form-elements.html">Form Elements</a></header>
  <main class="home-main">
    <a class="google-logo" href="index.html" aria-label="Google home"><span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span><span class="image-label">Images</span></a>
    <form class="search-form" action="https://www.google.com/search" method="get">
      <input type="hidden" name="tbm" value="isch">
      <label class="search-box" for="image-query">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
        <input id="image-query" type="text" name="q" aria-label="Search images" autocomplete="off" autofocus>
      </label>
      <div class="search-actions"><input class="search-button" type="submit" value="Google Image Search"></div>
    </form>
  </main>
  <footer class="footer">
    <span>Find images with Google</span>
    <a class="citations-link" href="https://github.com/vixiik/tomasgoogle/blob/main/citace.md" target="_blank" rel="noopener noreferrer">Citace a zdroje</a>
    <nav class="validator-links" aria-label="Validace stránky">
      <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fvixiik.github.io%2Ftomasgoogle%2Fimages.html" target="_blank" rel="noopener noreferrer" aria-label="Validovat HTML" title="Validovat HTML">
        <img src="https://validator.w3.org/nu/icon.png" width="16" height="16" alt="Nu HTML Checker">
        <span>HTML</span>
      </a>
      <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fvixiik.github.io%2Ftomasgoogle%2Fstyles.css" target="_blank" rel="noopener noreferrer" aria-label="Validovat CSS" title="Validovat CSS">
        <img src="https://jigsaw.w3.org/css-validator/images/vcss-blue" width="88" height="31" alt="Valid CSS!">
        <span>CSS</span>
      </a>
    </nav>
  </footer>
</body>
</html>
