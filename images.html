<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Image Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page image-page">
  <header class="top-nav"><a href="index.html">Google Search</a><a href="advanced.html">Advanced Search</a></header>
  <main class="home-main">
    <a class="google-logo" href="index.html" aria-label="Google home"><span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span><span class="image-label">Images</span></a>
    <form class="search-form" action="https://www.google.com/search" method="get">
      <input type="hidden" name="tbm" value="isch">
      <label class="search-box" for="image-query">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
        <input id="image-query" type="text" name="q" aria-label="Search images" autocomplete="off" autofocus>
      </label>
      <div class="search-actions"><input class="search-button" type="submit" value="Google Image Search"></div>
    </form>
  </main>
  <footer class="footer">
    <span>Find images with Google</span>
    <nav class="validator-links" aria-label="Validace stránky">
      <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fraw.githack.com%2Fvixiik%2Fgooglesearch%2Fmain%2Fimages.html" aria-label="Validovat HTML této stránky" title="Validovat HTML této stránky">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 3h12l7 7v19H7z"></path><path d="M19 3v8h7M11 17l-3 3 3 3m10-6 3 3-3 3m-3-7-3 8"></path></svg>
      </a>
      <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fraw.githack.com%2Fvixiik%2Fgooglesearch%2Fmain%2Fstyles.css&amp;profile=css3svg&amp;usermedium=all&amp;warning=1&amp;vextwarning=&amp;lang=cs" aria-label="Validovat CSS této stránky" title="Validovat CSS této stránky">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 3h14l-2 23-5 3-5-3z"></path><path d="M12 10h9m-10 5h9m-9 5h7"></path></svg>
      </a>
    </nav>
  </footer>
</body>
</html>
